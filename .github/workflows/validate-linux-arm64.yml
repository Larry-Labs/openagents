name: Validate Linux Launcher (fork only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            deb_arch: amd64
            appimage_arch: x86_64
            update_file: latest-linux.yml
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            appimage_arch: arm64
            update_file: latest-linux-arm64.yml
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: packages/launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/launcher-linux-arm64
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-builder-${{ hashFiles('packages/launcher/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-electron-builder-
      - name: Install dependencies
        run: |
          npm cache clean --force
          npm install
      - name: Install Workspace frontend dependencies
        uses: ./.github/actions/workspace-frontend-deps
      - name: Test Linux target selection
        run: node --test scripts/linux-build.test.mjs
      - name: Build Linux app
        shell: bash
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/
          ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/
        run: |
          # Retry to ride out transient electron-builder binary-download 504s.
          for i in 1 2 3; do
            npm run build:linux:${{ matrix.arch }} && exit 0
            echo "::warning::Linux build attempt $i failed (likely a transient electron-builder binary download); retrying in 25s…"
            sleep 25
          done
          echo "Linux build failed after 3 attempts." >&2
          exit 1
      - name: Verify Linux artifacts
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
          UPDATE_FILE: ${{ matrix.update_file }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          deb="dist/OpenAgents-${version}-linux-${DEB_ARCH}.deb"
          appimage="dist/OpenAgents-${version}-linux-${APPIMAGE_ARCH}.AppImage"
          test -s "$deb"
          test -s "$appimage"
          test "$(dpkg-deb --field "$deb" Architecture)" = "$DEB_ARCH"
          # Check the actual Electron executable, not only the artifact name.
          unpacked=dist/linux-unpacked
          machine='Advanced Micro Devices X86-64'
          if [ "$BUILD_ARCH" = arm64 ]; then
            unpacked=dist/linux-arm64-unpacked
            machine=AArch64
          fi
          readelf -h "$unpacked/openagents" | grep -F "$machine"
          readelf -h "$appimage" | grep -F "$machine"
          test -s "$unpacked/resources/app.asar"
          test -s "$unpacked/resources/workspace/index.html"
          # Linux feeds are separate per architecture; never merge them like macOS.
          node --input-type=commonjs <<'JS'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const yaml = require('js-yaml')
          const { version } = require('./package.json')
          const { APPIMAGE_ARCH, DEB_ARCH, UPDATE_FILE } = process.env
          const metadata = yaml.load(fs.readFileSync(`dist/${UPDATE_FILE}`, 'utf8'))
          const appimage = `OpenAgents-${version}-linux-${APPIMAGE_ARCH}.AppImage`
          const deb = `OpenAgents-${version}-linux-${DEB_ARCH}.deb`
          assert.equal(metadata.version, version)
          assert.equal(metadata.path, appimage)
          assert(metadata.files.some(file => file.url === appimage))
          assert(metadata.files.every(file => [appimage, deb].includes(file.url)))
          JS
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux-${{ matrix.arch }}
          path: |
            packages/launcher/dist/*.AppImage
            packages/launcher/dist/*.deb
            packages/launcher/dist/${{ matrix.update_file }}
          if-no-files-found: error
